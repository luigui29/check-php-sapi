services:
  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    expose:
      - "9000"
    container_name: php
  
  apache:
    build: 
      context: .
      dockerfile: apache/Dockerfile
    ports:
      - "8000:80" # Cambia el primer puerto según tus necesidades
    depends_on:
      - php
    container_name: apache

networks:
  default:
    name: check-php-sapi